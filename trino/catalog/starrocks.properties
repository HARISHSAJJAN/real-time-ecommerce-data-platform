# Trino catalog pointing at StarRocks.
#
# StarRocks does not (yet) ship an official Trino connector, but its
# frontend (FE) exposes a MySQL-wire-protocol query port (9030) that is
# largely compatible with Trino's built-in `mysql` connector for read
# queries. This is a documented, pragmatic pattern for federating StarRocks
# through Trino without adding an unsupported third-party plugin - see
# docs/architecture.md ("Design Decisions" -> Trino) for the full rationale.
#
# Two non-default settings were required to make this actually work,
# discovered by querying through Trino and watching `SHOW TABLES` return
# only the `purchases` view instead of every table:
#
# - `mysql.jdbc.use-information-schema=false`: StarRocks reports its wire
#   protocol as MySQL version "5.1.0" for compatibility. The MySQL JDBC
#   driver's default `DatabaseMetaData.getTables()` path queries
#   INFORMATION_SCHEMA and, against that reported version, only returned
#   VIEWs - StarRocks' OLAP BASE TABLEs never showed up. Forcing the driver
#   to use legacy `SHOW`-based metadata calls instead fixes table discovery.
# - `useServerPrepStmts=false` (JDBC URL param): StarRocks' MySQL-protocol
#   server does not fully implement server-side prepared statements; forcing
#   the client-side/text protocol avoids relying on that.
connector.name=mysql
connection-url=jdbc:mysql://starrocks:9030?useServerPrepStmts=false&useSSL=false
connection-user=root
connection-password=
mysql.jdbc.use-information-schema=false
